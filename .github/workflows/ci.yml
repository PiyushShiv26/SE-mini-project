name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: src/frontend
        run: npm test

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: src/backend
        run: npm ci

      - name: Test backend
        working-directory: src/backend
        run: npm test
