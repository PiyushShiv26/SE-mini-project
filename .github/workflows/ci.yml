name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campus_rides_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campus_rides_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: src/frontend
        run: npm test

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: src/backend
        run: npm ci

      - name: Test backend
        working-directory: src/backend
        env:
          NODE_ENV: test
          DATABASE_URL_TEST: postgresql://postgres:test-password@localhost:5432/campus_rides_test
          SESSION_SECRET: ci-test-session-secret-at-least-32-characters
        run: npm test
