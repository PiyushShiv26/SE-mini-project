name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check frontend
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npm test --if-present
          fi

      - name: Check backend
        run: |
          if [ -f backend/package.json ]; then
            cd backend
            npm ci
            npm test --if-present
          fi