services:
  db:
    image: postgres:16-alpine
    container_name: campusride-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_rides
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-campusride
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - campusride-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_rides"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  campusride-postgres:
